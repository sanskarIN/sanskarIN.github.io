name: Kahani pages

on:
  pull_request:
    paths:
      - 'Kahani.html'
      - '_posts/**'
      - '.github/scripts/post_markdown.py'
      - '.github/scripts/check_blog_posts.py'
      - 'about.html'
      - 'developer.html'
      - 'contact.html'
      - '404.html'
      - '_data/contact_page.json'
      - '_data/not_found_page.json'
      - '.github/scripts/utility_pages.py'
      - '.github/scripts/check_generated_pages.py'
      - 'index.html'
      - '_data/home_content.json'
      - '.github/scripts/home_render.py'
      - '_data/about_content.json'
      - '_data/developer_details.json'
      - '.github/scripts/generate_site_content.py'
      - '.github/scripts/check_generated_pages.py'
      - 'About-Kahani-Videos.html'
      - '_data/kahani.yml'
      - '_data/navigation.yml'
      - '_includes/**'
      - '_layouts/**'
      - 'assets/**'
      - 'src/ts/kahani.ts'
      - 'Gemfile'
      - '_data/theme.json'
      - '_data/design_tokens.json'
      - '.github/scripts/build_styles.py'
      - '.github/scripts/check_kahani.py'
      - '.github/workflows/kahani.yml'
  push:
    branches: [main]
    paths:
      - 'contact.html'
      - '404.html'
      - '_data/contact_page.json'
      - '_data/not_found_page.json'
      - '.github/scripts/utility_pages.py'
      - '.github/scripts/check_generated_pages.py'
      - 'Kahani.html'
      - '_posts/**'
      - '.github/scripts/post_markdown.py'
      - '.github/scripts/check_blog_posts.py'
      - 'About-Kahani-Videos.html'
      - '_data/kahani.yml'
      - '_data/navigation.yml'
      - '_includes/**'
      - '_layouts/**'
      - 'assets/**'
      - 'src/ts/kahani.ts'
      - 'Gemfile'
      - '_data/theme.json'
      - '_data/design_tokens.json'
      - '.github/scripts/build_styles.py'
      - '.github/scripts/check_kahani.py'
      - '.github/workflows/kahani.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check browser scripts
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
          git diff --exit-code -- assets/js/
      - name: Verify Python-generated site sources
        run: python .github/scripts/generate_site_content.py --check
      - name: Build the GitHub Pages site
        run: bundle exec jekyll build --strict_front_matter --trace
      - name: Check the Kahani pages
        run: python .github/scripts/check_kahani.py _site
      - name: Check Python-generated pages
        run: python .github/scripts/check_generated_pages.py _site
      - name: Check Markdown blog posts and published URLs
        run: python .github/scripts/check_blog_posts.py _site
