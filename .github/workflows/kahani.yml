name: Kahani pages

on:
  pull_request:
    paths:
      - 'Kahani.html'
      - 'About-Kahani-Videos.html'
      - '_data/kahani.yml'
      - '_data/navigation.yml'
      - '_includes/**'
      - '_layouts/**'
      - 'assets/**'
      - 'src/ts/kahani.ts'
      - 'Gemfile'
      - '.github/scripts/check_kahani.mjs'
      - '.github/workflows/kahani.yml'
  push:
    branches: [main]
    paths:
      - 'Kahani.html'
      - 'About-Kahani-Videos.html'
      - '_data/kahani.yml'
      - '_data/navigation.yml'
      - '_includes/**'
      - '_layouts/**'
      - 'assets/**'
      - 'src/ts/kahani.ts'
      - 'Gemfile'
      - '.github/scripts/check_kahani.mjs'
      - '.github/workflows/kahani.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Check browser scripts
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
          git diff --exit-code -- assets/js/
      - name: Build the GitHub Pages site
        run: bundle exec jekyll build --strict_front_matter --trace
      - name: Check the Kahani pages
        run: node .github/scripts/check_kahani.mjs _site
