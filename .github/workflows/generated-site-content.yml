name: Generated site content

on:
  pull_request:
    paths:
      - 'developer.html'
      - 'terminal.json'
      - 'search.json'
      - '.github/scripts/terminal_data.py'
      - '.github/scripts/search_index.py'
      - '.github/scripts/tests/test_search_index.py'
      - '.github/scripts/tests/test_data_parity.py'
      - '_config.yml'
      - '_data/github.json'
      - '_data/navigation.yml'
      - '_data/social.yml'
      - '_data/contact.yml'
      - '_data/focus.yml'
      - '_data/technologies.yml'
      - '_posts/**'
      - '.github/scripts/post_markdown.py'
      - '.github/scripts/tests/test_post_markdown.py'
      - 'contact.html'
      - '404.html'
      - '_data/contact_page.json'
      - '_data/not_found_page.json'
      - '.github/scripts/utility_pages.py'
      - '.github/scripts/check_generated_pages.py'
      - 'index.html'
      - '_data/home_content.json'
      - '.github/scripts/home_render.py'
      - 'about.html'
      - '_data/about_content.json'
      - '_data/developer_details.json'
      - '_data/design_tokens.json'
      - '_data/theme.json'
      - '_includes/css/**'
      - 'assets/css/main.css'
      - '.github/scripts/build_styles.py'
      - '.github/scripts/tests/test_build_styles.py'
      - '_includes/generated/**'
      - '_includes/css/tokens.css'
      - '.github/scripts/generate_site_content.py'
      - '.github/scripts/tests/test_generate_site_content.py'
      - '.github/workflows/generated-site-content.yml'
  push:
    branches: [main]
    paths:
      - 'developer.html'
      - 'terminal.json'
      - 'search.json'
      - '.github/scripts/terminal_data.py'
      - '.github/scripts/search_index.py'
      - '.github/scripts/tests/test_search_index.py'
      - '.github/scripts/tests/test_data_parity.py'
      - '_config.yml'
      - '_data/github.json'
      - '_data/navigation.yml'
      - '_data/social.yml'
      - '_data/contact.yml'
      - '_data/focus.yml'
      - '_data/technologies.yml'
      - '_posts/**'
      - '.github/scripts/post_markdown.py'
      - '.github/scripts/tests/test_post_markdown.py'
      - 'contact.html'
      - '404.html'
      - '_data/contact_page.json'
      - '_data/not_found_page.json'
      - '.github/scripts/utility_pages.py'
      - '.github/scripts/check_generated_pages.py'
      - 'index.html'
      - '_data/home_content.json'
      - '.github/scripts/home_render.py'
      - '_data/developer_details.json'
      - '_data/design_tokens.json'
      - '_data/theme.json'
      - '_includes/css/**'
      - 'assets/css/main.css'
      - '.github/scripts/build_styles.py'
      - '.github/scripts/tests/test_build_styles.py'
      - '_includes/generated/**'
      - '_includes/css/tokens.css'
      - '.github/scripts/generate_site_content.py'
      - '.github/scripts/tests/test_generate_site_content.py'
      - '.github/workflows/generated-site-content.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install terminal feed YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify generated files are current
        run: python .github/scripts/generate_site_content.py --check
      - name: Test Python rendering and input safety
        run: python -m unittest discover -s .github/scripts/tests -p 'test_generate_site_content.py' -v
      - name: Test Python stylesheet compiler
        run: python -m unittest discover -s .github/scripts/tests -p 'test_build_styles.py' -v
      - name: Test terminal JSON regeneration
        run: python -m unittest discover -s .github/scripts/tests -p 'test_data_parity.py' -v
      - name: Test Python search-index generation
        run: python -m unittest discover -s .github/scripts/tests -p 'test_search_index.py' -v
      - name: Test Markdown blog conversion
        run: python -m unittest discover -s .github/scripts/tests -p 'test_post_markdown.py' -v
