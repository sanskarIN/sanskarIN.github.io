# Validate the Python publisher and branch-protection integration.
name: Content automation

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/publish-blog-post.yml"
      - ".github/workflows/update-github-data.yml"
      - ".github/workflows/content-automation.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/publish-blog-post.yml"
      - ".github/workflows/update-github-data.yml"
      - ".github/workflows/content-automation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r .github/scripts/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .github/scripts
      - name: Run unit tests
        run: python -m unittest discover -s .github/scripts/tests -v
