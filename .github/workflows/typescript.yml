# Checks the TypeScript sources of the site's scripts (src/ts/): that their
# types are correct, and that the compiled files in assets/js/ — which
# GitHub Pages serves — are up to date. See README.md → "TypeScript".
#
# Runs when the sources, the compiled scripts, or the TypeScript settings
# change. It only reads the repository: no secrets.

name: TypeScript

on:
  push:
    branches: [main]
    paths:
      - src/ts/**
      - assets/js/**
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/typescript.yml
      - .github/scripts/tests/lab-json.test.cjs
      - .github/scripts/tests/lab-next.test.cjs
      - .github/scripts/tests/lab-convert.test.cjs
      - .github/scripts/tests/lab-contrast.test.cjs
      - .github/scripts/tests/lab-themes.test.cjs
      - .github/scripts/tests/projects.test.cjs
  pull_request:
    paths:
      - src/ts/**
      - assets/js/**
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/typescript.yml
      - .github/scripts/tests/lab-json.test.cjs
      - .github/scripts/tests/lab-next.test.cjs
      - .github/scripts/tests/lab-convert.test.cjs
      - .github/scripts/tests/lab-contrast.test.cjs
      - .github/scripts/tests/lab-themes.test.cjs
      - .github/scripts/tests/projects.test.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install TypeScript
        # Node.js comes with the runner; the version of TypeScript is the
        # one in package-lock.json.
        run: npm ci --no-audit --no-fund
      - name: Check the types
        run: npm run check
      - name: Test Developer Lab browser logic
        run: npm run test:lab
      - name: Test Projects page filtering and sorting
        run: npm run test:projects
      - name: Check that assets/js/ matches src/ts/
        run: |
          npm run build
          if ! git diff --quiet -- assets/js; then
            git diff --stat -- assets/js
            git diff -- assets/js | sed -n '1,220p'
            echo "::error::assets/js/ is out of date. Run npm run build and commit the result."
            exit 1
          fi
