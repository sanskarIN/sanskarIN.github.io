# Checks the curated Scarp destinations without changing published content.
# Offline syntax and security tests run on PRs in generated-site-content.yml;
# network checks are kept in this scheduled, read-only workflow.
name: Scarp ecosystem link audit

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Check live Scarp repositories and published destinations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/check_scarp_ecosystem.py
