name: Resource library

on:
  pull_request:
    paths:
      - 'resources/**'
      - '_includes/resource-filter.html'
      - '_includes/file-size.html'
      - '_includes/post-attachments.html'
      - 'assets/js/resource-library.js'
      - '.github/scripts/check_resource_catalog.py'
      - '.github/scripts/tests/resource-library.test.cjs'
      - '.github/scripts/tests/test_resource_catalog.py'
      - '.github/workflows/resource-library.yml'
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - '_includes/resource-filter.html'
      - '_includes/file-size.html'
      - 'assets/js/resource-library.js'
      - '.github/scripts/check_resource_catalog.py'
      - '.github/scripts/tests/resource-library.test.cjs'
      - '.github/scripts/tests/test_resource_catalog.py'
      - '.github/workflows/resource-library.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install metadata parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Test resource library browser behavior
        run: node --test .github/scripts/tests/resource-library.test.cjs
      - name: Test resource catalog audit
        run: python -m unittest discover -s .github/scripts/tests -p test_resource_catalog.py
