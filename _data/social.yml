# =============================================================================
#  Social, professional, and support links — the single source of truth.
#
#  The header, footer, Home, About, Contact, and Developer pages and the
#  structured data (JSON-LD) are all generated from this file. Change a URL
#  here and it changes everywhere.
#
#  Fields
#    name      display name of the service
#    url       full profile URL (a blank url hides the link everywhere)
#    handle    how the username is written on that service
#    username  the username used on that service (most use sanskarIN or
#              dev_sanskarIN; the About page groups profiles by username)
#    icon      symbol id in assets/icons/sprite.svg
#    note      short description, shown on the Contact and Home pages
#    same_as   false = leave out of structured data (not a personal profile)
# =============================================================================

profiles:
  github:
    name: GitHub
    url: https://www.github.com/sanskarIN
    handle: sanskarIN
    username: sanskarIN
    icon: github
    note: Code, repositories, and open source

  linkedin:
    name: LinkedIn
    url: https://www.linkedin.com/in/sanskarIN
    handle: sanskarIN
    username: sanskarIN
    icon: linkedin
    note: Professional profile

  devto:
    name: Dev.to
    url: https://www.dev.to/sanskarIN
    handle: sanskarIN
    username: sanskarIN
    icon: devdotto
    note: Articles and developer discussion

  discord:
