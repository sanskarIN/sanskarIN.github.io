    username: sanskarIN
    icon: gumroad
    note: Digital products

  # ---------------------------------------------------------------------------
  # PAYPAL_URL — PayPal is intentionally not enabled yet.
  # When you have the real PayPal link, paste it between the quotes below.
  # That's the only step: the PayPal link then appears automatically in the
  # footer, on the Contact page, and in the Home page support section.
  # ---------------------------------------------------------------------------
  paypal:
    name: PayPal
    url: ""
    icon: paypal
    note: Support my work
    same_as: false

# How profiles are grouped on the site, in display order.
groups:
  developer:
    title: Developer
    items: [github, linkedin, devto, discord]
  social:
    title: Social
    items: [x, instagram, threads, pinterest, bluesky]
  products:
    title: Support & Products
    items: [buymeacoffee, gumroad, paypal]

# Profiles featured in the Home page "Developer community" section.
community: [devto, discord, x, bluesky, linkedin]

# Profiles suggested under "Follow along" on the thank-you pages.
follow: [github, x, instagram, linkedin, devto]
