# =============================================================================
#  Navigation. URLs are site-relative and end with a slash.
#  The footer also lists the profile groups from _data/social.yml and the
#  email groups from _data/contact.yml.
# =============================================================================

# Canonical destinations shared by footer, terminal and grouped header.
main:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Developer
    url: /developer/
  # Resolves automatically: see `projects_url` in _config.yml.
  - title: Projects
    url: /projects/
  - title: Scarp Lang
    url: /ScarpLang/
  - title: Lab
    url: /lab/
  - title: Blog
    url: /blog/
  - title: Articles
    url: /articles/
  - title: Research
    url: /research/
  - title: Assets
    url: /resources/
  - title: Kahani
    url: /Kahani/
  - title: Contact
    url: /contact/
  - title: Support
    url: /support/

# Each destination appears once in the header, either directly or in a group.
header:
  - url: /
  - url: /about/
  - group: work
    title: Work
    urls:
      - /projects/
      - /ScarpLang/
      - /developer/
      - /lab/
  - group: writing
    title: Writing
    urls:
      - /articles/
      - /research/
      - /blog/
      - /resources/
  - group: more
    title: More
    urls:
      - /Kahani/
      - /support/
  - url: /contact/

legal:
  - title: Terms
    url: /terms/
  - title: Privacy
    url: /privacy/
  - title: Cookies
    url: /cookies/
  - title: Accessibility
    url: /accessibility/

information:
  - title: Credits
    url: /credits/
  - title: About Kahani Videos
    url: /About-Kahani-Videos/
