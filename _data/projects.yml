# =============================================================================
#  Projects page settings (/projects/ and the Home page's "Open source"
#  section). See README.md → "Projects".
#
#  The repositories themselves come from GitHub: the "Update GitHub data"
#  workflow (.github/workflows/update-github-data.yml) reads this file,
#  fetches the account's public repositories plus explicitly maintained organization
#  repositories, and writes _data/github.json.
#  It runs every day and whenever this file changes — don't edit
#  _data/github.json by hand.
# =============================================================================

# The GitHub account whose public repositories are shown.
github_user: sanskarIN

# Public organization repositories I actively maintain. These are included in
# project listings, GitHub language percentages, and total classified code size.
# The list is explicit so contributions to unrelated organizations are not
# incorrectly presented as my own work.
additional_repositories:
  - scarp-lang/scarp

# Feature up to six repositories in the exact order below (repository names).
# Scarp is maintained in the scarp-lang organization rather than this account.
featured:
  - scarp
  - RepoDNA
  - frametrellis
  - latebrake
  - LineLoom
  - awesome-tech-atlas

# Repositories to leave out (repository names). The profile README
# repository (github.com/sanskarIN/sanskarIN) is always left out.
hidden: []

# Whether to include forks of other people's repositories, and archived
# (read-only) repositories.
show_forks: false
show_archived: true
