# =============================================================================
#  Email addresses — the single source of truth.
#
#  Each address is written exactly once, in `email` below. Everything else
#  (Contact page, footer, Home page, policy pages, security.txt) refers to
#  these keys, so changing an address here updates the whole site.
#
#  Using an address in a page:  {% include email-link.html key="support" %}
# =============================================================================

email:
  business_primary: sanskarin@outlook.in
  business_secondary: sanskarin.business@gmail.com
  support: supportramsandesh@gmail.com

# What each group of addresses is for, as shown on the site.
groups:
  business:
    title: Business
    summary: For business and professional communication.
    purposes:
      - Business inquiries
      - Professional collaborations
      - Development services
      - Partnerships
      - Source-code inquiries
      - Digital-product inquiries
      - General professional communication
    addresses:
      - key: business_primary
        label: Primary
      - key: business_secondary
        label: Secondary

  support:
    title: Support
    summary: For help with a project, this website, or anything support-related.
    purposes:
      - Technical support
      - Project support
      - Website support
      - Assistance and support-related questions
    addresses:
      - key: support
        label: Support

# =============================================================================
#  Contact form (optional), delivered by Web3Forms — https://web3forms.com
#
#  GitHub Pages cannot send email by itself, so a form service forwards the
#  messages to your inbox. The form is shown only while an access key is set;
#  clear the key to hide it again.
#
#  FORM_ACCESS_KEY — to set or replace the key:
#   1. Sign in at https://app.web3forms.com with the email address that
#      should receive the messages, and create a form (for example, name
#      "sanskarIN.github.io contact form", website sanskarin.github.io/contact).
#   2. Copy its Form Access Key and paste it between the quotes below.
#   3. Update the `privacy`, `terms`, and `cookies` dates in _data/legal.yml:
#      those pages describe the form automatically while it is on.
#  The access key is public by design (it only lets people send messages to
#  that address), so it is safe to commit. It is not a password.
#  The receiving address and other settings are managed in the Web3Forms
#  dashboard.
# =============================================================================
form:
  access_key: "3c6bd381-7d2b-461b-9b86-c43f92f6597e"
  endpoint: https://api.web3forms.com/submit
  service: Web3Forms
  service_url: https://web3forms.com/
  service_privacy_url: https://docs.web3forms.com/getting-started/faq
  subject: New message from sanskarIN.github.io
  topics:
    - Business inquiry
    - Professional collaboration
    - Development services
    - Partnership
    - Source-code inquiry
    - Digital-product inquiry
    - Support request
    - Other
